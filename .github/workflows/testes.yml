name: Suíte de Avaliação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  avaliar:
    name: Avaliar a agente Luma
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testes unitários das ferramentas
        run: python eval/testar_calculos.py

      - name: Rodar a suíte de avaliação
        run: python eval/avaliar.py

      - name: Conferir se os exemplos estão atualizados
        run: |
          python examples/gerar_exemplos.py
          git diff --exit-code examples/conversas.md \
            || (echo "examples/conversas.md desatualizado: rode 'python examples/gerar_exemplos.py' e commite" && exit 1)

      - name: Publicar relatório no resumo
        if: always()
        run: cat eval/resultado.md >> "$GITHUB_STEP_SUMMARY"
